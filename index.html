<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Affärssvenska">
<title>Affärssvenska</title>
<link rel="manifest" href="manifest.json"><script src="fb.js"></script><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6FA;--surface:#FFFFFF;--ink:#14233A;--muted:#5D6B80;--line:#D8E0EA;
  --blue:#1E5BB8;--blue-soft:#E3ECF8;--on-blue:#FFFFFF;--streak-bg:#1E5BB8;--streak-ink:#FFFFFF;--streak-dot:#FFFFFF;
  --ok:#1F8A55;--ok-soft:#E2F4EA;--bad:#C2413A;--bad-soft:#FBE7E5;--warn:#B7791F;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A2B;--surface:#17243A;--ink:#E9EEF6;--muted:#9AA8BC;--line:#2A3B57;
  --blue:#6FA2EE;--blue-soft:#1F3352;--on-blue:#0F1A2B;--streak-bg:#F3F6FA;--streak-ink:#14233A;--streak-dot:#1E5BB8;
  --ok:#4CC28A;--ok-soft:#173A2B;--bad:#EF7B73;--bad-soft:#3E1F1D;--warn:#E3B04B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A2B;--surface:#17243A;--ink:#E9EEF6;--muted:#9AA8BC;--line:#2A3B57;
  --blue:#6FA2EE;--blue-soft:#1F3352;--on-blue:#0F1A2B;--streak-bg:#F3F6FA;--streak-ink:#14233A;--streak-dot:#1E5BB8;
  --ok:#4CC28A;--ok-soft:#173A2B;--bad:#EF7B73;--bad-soft:#3E1F1D;--warn:#E3B04B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:12px 18px 32px}
#vLearn{padding-bottom:var(--kb,0px)}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;flex:none}
h1{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin:6px 0}
h2{font-size:1.2rem;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
/* Streak */
.streak{background:var(--streak-bg);color:var(--streak-ink);border-radius:22px;padding:18px 20px;margin:12px 0 16px}
.streak .big{font-size:2.3rem;font-weight:800;line-height:1}
.streak .lbl{font-size:.9rem;opacity:.85}
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;opacity:.9}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;opacity:.5}
.dot.on{background:var(--streak-dot);border-color:var(--streak-dot);opacity:1}
.dot.today{outline:2px solid currentColor;outline-offset:2px;opacity:1}
.goalbar{height:8px;border-radius:4px;background:rgba(127,127,127,.3);margin-top:14px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--streak-dot);width:0}
/* Kacheln */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 0;overflow:hidden;display:flex;flex-direction:column;min-height:150px}
.tile h3{margin:0 0 8px;font-size:.98rem;font-weight:700;line-height:1.25;flex:1}
.stats{display:grid;grid-template-columns:1fr auto;row-gap:2px;font-size:.82rem;margin-bottom:10px}
.stats span:nth-child(odd){color:var(--muted)}
.stats span:nth-child(even){font-weight:700;text-align:right}
.bar{height:5px;background:var(--blue-soft);margin:0 -14px}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.primary{width:100%;border:0;border-radius:18px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:1.05rem;padding:15px}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:600}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
/* Liste */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item b{display:block;font-weight:700}
.item span{color:var(--muted);font-size:.88rem}
.st{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.st.l{background:var(--warn)}.st.d{background:var(--ok)}
/* Karte */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px;text-align:center;touch-action:pan-y;transition:transform .2s}
.cardtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem;margin-bottom:10px}
.cardtop button{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px}
.de-word{font-size:1.6rem;font-weight:800;display:inline-block;border-bottom:3px solid var(--blue);padding-bottom:4px;line-height:1.25}
.de-word.w{font-size:1.2rem;font-weight:700}
.typ{font-size:.85rem;color:var(--muted);margin-left:6px}
.lemma{margin-top:12px;font-size:1.15rem;font-weight:700;color:var(--blue);min-height:1.5em}
.lemma small{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.old{display:inline-block;font-size:.75rem;color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.sv{font-size:1.22rem;line-height:1.7;margin:20px 0 8px}
.gap{font:inherit;font-weight:700;padding:2px 8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;max-width:100%}
.solo{width:100%;margin:18px 0 6px;font-size:1.15rem;padding:10px}
textarea.solo{min-height:84px;text-align:left;resize:vertical;font-weight:600}
.fill{font-weight:800;padding:0 4px;border-radius:6px}
.fill.ok{background:var(--ok-soft);color:var(--ok)}.fill.bad{background:var(--bad-soft);color:var(--bad)}
.dex{color:var(--muted);line-height:1.6}
.dex b{color:var(--ink)}
.answer{font-size:1.25rem;font-weight:700;margin:18px 0 6px;line-height:1.5}
.alts{color:var(--muted);font-size:.92rem;line-height:1.5}
.yours{font-size:.9rem;color:var(--muted);margin-top:8px}
.diff{font-weight:700;color:var(--ink);font-size:1.05rem;letter-spacing:.02em}
.diff ins,.difflegend ins{text-decoration:underline;text-decoration-thickness:2px;color:var(--ok);background:var(--ok-soft);border-radius:3px;font-weight:800}
.diff del,.difflegend del{text-decoration:line-through;text-decoration-thickness:2px;color:var(--bad);background:var(--bad-soft);border-radius:3px}
.difflegend{font-size:.75rem;color:var(--muted);margin-top:4px}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.shake{animation:shake .45s}
.gap.wrong{border-color:var(--bad)}
.msg{min-height:1.3em;margin-top:10px;font-size:.9rem;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
.src{color:var(--muted);font-size:.8rem;margin-top:6px}
.tools{display:flex;justify-content:center;gap:10px;margin-top:14px}
.tool{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 14px;font-size:.9rem;font-weight:600}
.actions{margin-top:14px}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate button{border-radius:18px;padding:14px 6px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.rate .no{color:var(--bad)}.rate .yes{background:var(--ok);border-color:var(--ok);color:#fff}.rate .never{color:var(--muted);font-size:.9rem}
.hintrow{display:flex;justify-content:flex-end;margin-top:8px}
.hintrow button{background:none;border:0;color:var(--blue);font-weight:600;padding:6px}
.done{text-align:center;padding:40px 10px}
.done b{display:block;font-size:1.4rem;margin-bottom:8px}
/* Sheet */
.sheet-bg{position:fixed;left:0;right:0;top:var(--vvtop,0px);height:var(--vvh,100%);background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.sheet textarea{min-height:64px;resize:vertical}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet .btns button{flex:1}
.danger{border:1px solid var(--bad);color:var(--bad);background:none;border-radius:14px;padding:12px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2);text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);line-height:1.5}
.stamp{position:absolute;left:50%;top:18px;transform:translateX(-50%) rotate(-8deg);z-index:5;pointer-events:none;opacity:0;font-weight:800;font-size:1.3rem;padding:6px 14px;border-radius:12px;border:3px solid currentColor;background:var(--surface);transition:opacity .1s}
.stamp.yes{color:var(--ok)}.stamp.no{color:var(--bad)}.stamp.never{color:var(--muted)}
.flagfield{display:flex;align-items:center;gap:8px}.flagfield .flag{font-size:1.5rem;line-height:1;flex:none}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.statbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.statbox b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
.statbox span{color:var(--muted);font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:10px}
.bars div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.met{background:var(--ok)}
.barlbl{display:flex;gap:4px;font-size:.62rem;color:var(--muted);margin-top:4px}.barlbl span{flex:1;text-align:center}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--blue-soft);margin:8px 0 4px}
.stack i{display:block;height:100%}
table.st{width:100%;border-collapse:collapse;font-size:.9rem}table.st td,table.st th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}table.st td:first-child,table.st th:first-child{text-align:left}
.plant{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-size:.72rem;font-weight:700}
.plantlbl{white-space:nowrap}
.plant.grow svg{animation:grow .42s ease-out}.plant.wilt svg{animation:wilt .42s ease-out}
@keyframes grow{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes wilt{0%{transform:scale(1.2) rotate(-8deg)}100%{transform:scale(1)}}
.tw{cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px;border-radius:4px}
.tw:active,.tw-on{background:var(--blue-soft)}
.stepttl{font-weight:800;font-size:.95rem;margin:18px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;background:none;border-radius:10px;padding:8px 4px;font-size:1.2rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button span{font-size:.78rem;font-weight:700}
.seg button.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.12);color:var(--blue)}
.srcpane{margin-top:10px}
.clearwrap{position:relative;margin-top:8px}.clearwrap input,.clearwrap textarea{padding-right:42px}
.clr{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:.85rem;line-height:1}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section id="vHome">
  <div class="row" style="justify-content:space-between">
    <h1>Affärssvenska</h1>
    <div class="row">
      <button class="icon-btn" id="statBtn" aria-label="Statistik">📊</button>
      <button class="icon-btn" id="themeBtn" aria-label="Daylight/Moonlight umschalten">🌙</button>
      <button class="icon-btn" id="setBtn" aria-label="Einstellungen">⚙︎</button>
    </div>
  </div>
  <div class="streak">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="big" id="sCur">0</div><div class="lbl" id="sCurLbl">Tage in Folge</div></div>
      <div style="text-align:right"><div class="lbl">Rekord</div><div style="font-weight:800;font-size:1.2rem" id="sBest">0</div></div>
    </div>
    <div class="goalbar"><i id="gBar"></i></div>
    <div class="lbl" style="margin-top:6px" id="gTxt"></div>
    <div class="week" id="week"></div>
  </div>
  <button class="primary" id="learnAll">Alle fälligen Karten lernen</button>
  <div class="row" style="margin-top:10px"><button class="secondary" id="newWord" style="flex:1;padding:14px 8px">＋ Neues Wort</button><button class="secondary" id="suggBtn" style="flex:1;padding:14px 8px">💡 Wortvorschläge</button></div>
  <button class="secondary" id="textBtn" style="width:100%;margin-top:10px;padding:14px">📄 Wörter aus Text (Stellenanzeige, Artikel …)</button>
  <div id="noData" class="empty hidden" style="margin-top:16px">Noch keine Buchkarten geladen.<br>Tippe auf ⚙︎ und dann auf „Karten laden“ – oder melde dich dort unter „Synchronisierung“ an.</div>
  <div class="section-title"><h2>Sammlungen</h2><button class="secondary" id="newColl">+ Sammlung</button></div>
  <div class="grid" id="grid"></div>
  <div class="muted small" id="syncLine" style="text-align:center;margin-top:18px"></div>
</section>

<section id="vColl" class="hidden">
  <div class="row"><button class="icon-btn" id="collBack" aria-label="Zurück">‹</button><h2 id="collName" style="flex:1"></h2><button class="icon-btn" id="collRename" aria-label="Sammlung bearbeiten oder zusammenführen">✎</button></div>
  <div class="row" style="margin-top:14px"><button class="primary" id="collLearn" style="flex:2">Lernen</button><button class="secondary" id="collAdd" style="flex:1;padding:15px 10px">+ Karte</button></div>
  <button class="secondary hidden" id="collFill" style="width:100%;margin-top:10px;padding:12px">✨ Sätze ergänzen</button>
  <div class="list" id="collList"></div>
  <button class="small secondary hidden" id="collReset" style="margin-top:14px;width:100%">Fortschritt dieser Sammlung zurücksetzen</button>
</section>

<section id="vStats" class="hidden">
  <div class="row"><button class="icon-btn" id="statBack" aria-label="Zurück">‹</button><h2 style="flex:1">Statistik</h2></div>
  <div id="statBody"></div>
</section>

<section id="vLearn" class="hidden">
  <div class="row" style="margin-bottom:12px"><button class="icon-btn" id="learnBack" aria-label="Zurück">‹</button>
    <div style="flex:1;height:32px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem" id="left"></div><button class="icon-btn" id="sndBtn" aria-label="Ton an/aus" title="Ton an/aus">🔊</button><button class="icon-btn" id="undoBtn" aria-label="Letzte Bewertung rückgängig machen" title="Rückgängig" disabled style="opacity:.35">↶</button></div>
  <div style="position:relative"><div class="stamp" id="stamp"></div></div>
  <div class="card" id="card"></div>
  <div class="hintrow" id="hintRow"><button id="hint">Hinweis</button></div>
  <div class="actions" id="actFront"><button class="primary" id="check">Aufdecken</button></div>
  <div class="actions rate hidden" id="actBack">
    <button class="no" id="rNo">✗ Nochmal</button><button class="never" id="rNever">Nie wieder</button><button class="yes" id="rYes">✓ Gewusst</button>
  </div>
  <div class="done hidden" id="done"><b>Geschafft!</b><span id="doneTxt">Für diese Auswahl sind heute keine Karten mehr fällig.</span><br><button class="secondary" id="donePractice" style="margin-top:16px">Freies Üben</button></div>
</section>

</div>
<div id="sheetRoot"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
const EMBEDDED = /*__DATA__*/null;
const CHAPTERS = {1:"Kap. 1 – Personalen. Kontoret.",2:"Kap. 2 – Att vara anställd. Besök på banken.",3:"Kap. 3 – Att samtala i telefon",4:"Kap. 4 – Samtal på arbetet",5:"Kap. 5 – Besök på en mässa",6:"Kap. 6 – Besök hos en tillverkare",7:"Kap. 7 – Presentation av ett företags verksamhet",8:"Kap. 8 – Eira sammanfattar sina intryck"};
const RV_CHAPTERS = {1:"Rivstart 1 – Arbetsmarknad och arbetstagare",2:"Rivstart 2 – Arbetsplatser",3:"Rivstart 3 – Arbetsplatskultur",4:"Rivstart 4 – Kundkontakt",5:"Rivstart 5 – Arbetsmiljö",6:"Rivstart 6 – Socialt på jobbet",7:"Rivstart 7 – Möten",8:"Rivstart 8 – Projekt och grupper"};
const FX_CHAPTERS = {1:"Lön & förmåner",2:"Anställning & arbetsrätt",3:"Skatt & myndigheter",4:"Ekonomi & redovisning",5:"Bank, finans & betalning",6:"Företagsformer & juridik",7:"Handel & marknad"};
const STEPS=[1,2,4,7,10,14], DAY=86400000;

// ---------- Speicher ----------
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let base = EMBEDDED || LS.get("as-data",[]);
let user = Object.assign({cards:[],colls:[],edits:{},deleted:[],names:{}}, LS.get("as-user",{}));
let prog = LS.get("as-prog",{});
let streak = Object.assign({goal:30,days:{},best:0}, LS.get("as-streak",{}));
const saveUser=()=>LS.set("as-user",user), saveProg=()=>LS.set("as-prog",prog), saveStreak=()=>LS.set("as-streak",streak);

function allCards(){
  const del=new Set(user.deleted);
  const b=base.filter(c=>!del.has(c.id)).map(c=>user.edits[c.id]?Object.assign({},c,user.edits[c.id]):c);
  return b.concat(user.cards);
}
function collections(){
  const cs=allCards(), out=[];
  const ks=[...new Set(cs.filter(c=>c.k!=null&&!c.b&&!c.coll).map(c=>c.k))].sort((a,b)=>a-b);
  ks.forEach(k=>out.push({id:"k"+k,book:"Affärssvenska",name:user.names["k"+k]||CHAPTERS[k]||("Kap. "+k),match:c=>c.k===k&&!c.b&&!c.coll}));
  const rs=[...new Set(cs.filter(c=>c.b==="rv"&&!c.coll).map(c=>c.k))].sort((a,b)=>a-b);
  rs.forEach(k=>out.push({id:"rv"+k,book:"Rivstart Yrkesliv",name:user.names["rv"+k]||RV_CHAPTERS[k]||("Rivstart "+k),match:c=>c.b==="rv"&&c.k===k&&!c.coll}));
  const fs=[...new Set(cs.filter(c=>c.b==="fx"&&!c.coll).map(c=>c.k))].sort((a,b)=>a-b);
  fs.forEach(k=>out.push({id:"fx"+k,book:"Fortnox-Begriffe",name:user.names["fx"+k]||FX_CHAPTERS[k]||("Fortnox "+k),match:c=>c.b==="fx"&&c.k===k&&!c.coll}));
  user.colls.forEach(col=>out.push({id:col.id,book:"Eigene Sammlungen",name:col.name,own:true,match:c=>c.coll===col.id}));
  return out;
}
// ---------- Zeit & Streak ----------
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};

let undoStack=[],busy=false;
function rate(kind){
  if(!revealed||busy)return;busy=true;const c=cur;
  // Schnappschuss für „Rückgängig“
  const dk=dkey(Date.now());
  undoStack.push({card:c,prev:prog[c.id]?JSON.parse(JSON.stringify(prog[c.id])):null,day:streak.days[dk]?JSON.parse(JSON.stringify(streak.days[dk])):null,best:streak.best,dk});
  if(undoStack.length>30)undoStack.shift();
  if(!practice){const s=prog[c.id]?Object.assign({},prog[c.id]):{lvl:0};
    if(kind==="yes"){if(s.lvl>=STEPS.length)s.done=true;else{s.due=today0()+STEPS[s.lvl]*DAY;s.lvl++}}
    else if(kind==="no"){s.lvl=0;s.due=today0()+DAY;s.done=false}
    else{s.done=true;s.never=true}
    prog[c.id]=s;saveProg();}
  sfx(kind);countToday(kind==="yes");
  const p=$("plant");
  if(p&&!practice&&kind!=="never"){p.outerHTML=plantBadge(c);const np=$("plant");np.classList.add(kind==="yes"?"grow":"wilt");
    setTimeout(()=>flyOut(kind,()=>{queue.shift();busy=false;next();updUndo()}),420)}
  else flyOut(kind,()=>{queue.shift();busy=false;next();updUndo()});
}
function flyOut(kind,cb){
  const el=$("card"),dir=kind==="no"?-1:1;
  el.style.transition="transform .32s ease-in, opacity .32s ease-in";
  el.style.transform=kind==="never"?"translateY(-40px) scale(.9)":`translateX(${dir*130}%) rotate(${dir*18}deg)`;
  el.style.opacity="0";stamp(kind,1);
  setTimeout(()=>{el.style.transition="none";el.style.transform="";el.style.opacity="";stamp(null);
    requestAnimationFrame(()=>{el.style.transition="";cb()})},320);
}
function stamp(kind,op){const s=$("stamp");if(!kind){s.style.opacity=0;return}
  s.textContent=kind==="yes"?"✓ Gewusst":kind==="no"?"✗ Nochmal":"Nie wieder";
  s.className="stamp "+kind;s.style.opacity=op}
function undo(){
  const u=undoStack.pop();if(!u)return;stopSpeech();
  if(u.prev)prog[u.card.id]=u.prev;else delete prog[u.card.id];saveProg();
  if(u.day)streak.days[u.dk]=u.day;else delete streak.days[u.dk];streak.best=u.best;saveStreak();
  const fresh=allCards().find(x=>x.id===u.card.id)||u.card;
  queue.unshift(fresh);sfx("undo");next();updUndo();toast("Rückgängig gemacht");
}

(function(){let x0=null,y0=null,dx=0;const el=$("card");
  el.addEventListener("touchstart",e=>{if(revealed&&!busy){x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;el.style.transition="none"}},{passive:true});
  el.addEventListener("touchmove",e=>{if(x0==null)return;dx=e.touches[0].clientX-x0;const dy=e.touches[0].clientY-y0;
    if(Math.abs(dy)>Math.abs(dx)*1.5&&Math.abs(dx)<20)return;

  el.addEventListener("touchend",()=>{if(x0==null)return;x0=null;el.style.boxShadow="";

function sheet(html){const r=$("sheetRoot");r.innerHTML=`<div class="sheet-bg"><div class="sheet">${html}</div></div>`;

function makeGap(sentence,form,c){
  if(!sentence.trim())return "";
  if(/\{.+?\}/.test(sentence))return sentence;
  const tryWrap=w=>{if(!w)return null;const i=sentence.toLowerCase().indexOf(w.toLowerCase());return i<0?null:sentence.slice(0,i)+"{"+sentence.slice(i,i+w.length)+"}"+sentence.slice(i+w.length)};
  let r=tryWrap(form.trim());if(r)return r;if(form.trim())return null;
  const k=core(c),rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(!k.includes(" ")){for(const stem of [k,k.slice(0,Math.max(3,k.length-1))]){const m=sentence.match(new RegExp("(^|[^\\p{L}])("+rx(stem)+"\\p{L}*)","iu"));if(m)return tryWrap(m[2])}}
  r=tryWrap(k);if(r)return r;
  return null;
}

const FB_CONFIG={apiKey:"AIzaSyBGIuC3Iwpu7Va6So-64If150rSXuBQ7gQ",authDomain:"schwedisch-grammatik.firebaseapp.com",projectId:"schwedisch-grammatik",storageBucket:"schwedisch-grammatik.firebasestorage.app",messagingSenderId:"291718040966",appId:"1:291718040966:web:ff9e0daa24792cd85f3007"};
const SYNC_KEYS=["as-data","as-user","as-prog","as-streak","as-theme"];
let syncMeta=LS.get("as-sync-meta",{}),syncDev=LS.get("as-sync-dev","");
if(!syncDev){syncDev=Math.random().toString(36).slice(2,10);LS.set("as-sync-dev",syncDev)}
let syncUser=null,syncDb=null,syncAuth=null,syncPending=new Set(),syncTimer=null,syncApplying=false,syncLast=0,syncErr="",syncBusy="",syncUnsub=null,syncIncoming={};
const syncOn=()=>!!(window.FB&&syncAuth);
const _lsSet=LS.set;
LS.set=function(k,v){_lsSet(k,v);if(!syncApplying&&SYNC_KEYS.includes(k)){syncMeta[k]=Date.now();_lsSet("as-sync-meta",syncMeta);queueSync(k)}};
function syncErrText(e){const c=e&&e.code||"";
  if(c.includes("permission-denied"))return "Keine Berechtigung in der Cloud – in Firebase fehlt noch eine Regel.";
  if(c.includes("unavailable")||c.includes("network"))return "Keine Verbindung – Änderungen werden später übertragen.";
  return "Synchronisierung gestört ("+(c||"Fehler")+")"}
function queueSync(k){if(!syncUser)return;syncPending.add(k);clearTimeout(syncTimer);syncTimer=setTimeout(flushSync,1500);renderSync()}
function flushSync(){
  if(!syncUser||!syncDb||!syncPending.size)return Promise.resolve();
  const keys=[...syncPending];syncPending.clear();const b=FB.writeBatch(syncDb);
  keys.forEach(k=>{const v=localStorage.getItem(k);b.set(FB.doc(syncDb,"users",syncUser.uid,"as",k),{v:v===null?null:v,t:syncMeta[k]||Date.now(),dev:syncDev})});
  const p=b.commit().then(()=>{syncLast=Date.now();syncErr="";renderSync()}).catch(e=>{syncErr=syncErrText(e);keys.forEach(k=>syncPending.add(k));renderSync()});
  renderSync();return p}
function syncReloadState(){
  base=EMBEDDED||LS.get("as-data",[]);
  user=Object.assign({cards:[],colls:[],edits:{},deleted:[],names:{}},LS.get("as-user",{}));
  prog=LS.get("as-prog",{});
  streak=Object.assign({goal:30,days:{},best:0},LS.get("as-streak",{}));
  const t=LS.get("as-theme","light");document.documentElement.dataset.theme=t;$("themeBtn").textContent=t==="dark"?"☀️":"🌙"}
function syncRerender(){
  if(!$("vColl").classList.contains("hidden"))renderColl();
  else if(!$("vStats").classList.contains("hidden"))renderStats();
  else renderHome()}
const syncUiBusy=()=>!$("vLearn").classList.contains("hidden")||$("sheetRoot").innerHTML!=="";
function syncApply(k,d){
  syncApplying=true;
  try{if(d.v===null||d.v===undefined)localStorage.removeItem(k);else localStorage.setItem(k,d.v)}catch(e){}finally{syncApplying=false}
  syncMeta[k]=d.t}
function syncTryApply(){
  const ks=Object.keys(syncIncoming);if(!ks.length||syncUiBusy())return;
  let n=0;ks.forEach(k=>{const d=syncIncoming[k];if(d.t>(syncMeta[k]||0)){syncApply(k,d);n++}});
  syncIncoming={};if(!n)return;
  _lsSet("as-sync-meta",syncMeta);syncReloadState();syncRerender();toast("☁ Stand vom anderen Gerät übernommen")}
function startListener(){
  if(syncUnsub)syncUnsub();
  syncUnsub=FB.onSnapshot(FB.collection(syncDb,"users",syncUser.uid,"as"),snap=>{
    snap.docChanges().forEach(ch=>{if(ch.type==="removed")return;const k=ch.doc.id,d=ch.doc.data();
      if(!SYNC_KEYS.includes(k)||!d||typeof d.t!=="number"||d.t<=(syncMeta[k]||0))return;syncIncoming[k]=d});
    if(!snap.metadata.fromCache){syncLast=Date.now();if(!syncPending.size)syncErr=""}
    syncTryApply();renderSync()},e=>{syncErr=syncErrText(e);renderSync()})}
async function initialMerge(){
  syncBusy="Erster Abgleich mit der Cloud …";renderSync();
  const remote={};
  try{const snap=await FB.getDocsFromServer(FB.collection(syncDb,"users",syncUser.uid,"as"));snap.forEach(d=>{if(SYNC_KEYS.includes(d.id))remote[d.id]=d.data()})}
  catch(e){syncBusy="";syncErr=(e&&e.code||"").includes("permission")?syncErrText(e):"Für den ersten Abgleich braucht die App Internet. Bitte später erneut anmelden.";renderSync();return}
  const uid=syncUser.uid;
  const done=()=>{_lsSet("as-sync-init-"+uid,1);syncBusy="";startListener();renderSync()};
  const upload=async(keys)=>{keys.forEach(k=>{if(localStorage.getItem(k)!==null){syncMeta[k]=Date.now();syncPending.add(k)}});_lsSet("as-sync-meta",syncMeta);done();await flushSync();if(!syncErr)toast("☁ Dein Stand ist jetzt in der Cloud")};
  const download=()=>{Object.keys(remote).forEach(k=>syncApply(k,remote[k]));_lsSet("as-sync-meta",syncMeta);syncReloadState();syncRerender();
    upload(SYNC_KEYS.filter(k=>!(k in remote)));toast("☁ Stand aus der Cloud übernommen")};
  if(!Object.keys(remote).length){await upload(SYNC_KEYS);return}
  const hasLocal=Object.keys(LS.get("as-prog",{})).length>0||(LS.get("as-user",{}).cards||[]).length>0;
  if(!hasLocal){download();return}
  syncBusy="";
  sheet(`<h2>Welcher Stand soll gelten?</h2>
    <div class="muted small" style="line-height:1.5">In der Cloud gibt es schon Daten, und auf diesem Gerät auch. Wähle, welcher Stand gelten soll – der andere wird überschrieben.<br><br>Tipp: Auf dem Gerät, mit dem du bisher gelernt hast (deinem iPhone), wählst du „Dieses Gerät“.</div>
    <button class="primary" id="smLocal" style="width:100%;margin-top:16px">Dieses Gerät hochladen</button>
    <button class="secondary" id="smCloud" style="width:100%;margin-top:10px">Cloud übernehmen</button>`);
  $("smLocal").onclick=()=>{closeSheet();upload(SYNC_KEYS)};
  $("smCloud").onclick=()=>{closeSheet();download()}}
function renderSync(){
  let txt;
  if(!syncOn())txt=window.FB?"Synchronisierung konnte nicht starten.":"Nur in der installierten App mit Internet verfügbar.";
  else if(!syncUser)txt="Nicht angemeldet – deine Daten liegen nur auf diesem Gerät.";
  else if(syncBusy)txt=syncBusy;
  else if(syncErr)txt=syncErr;
  else if(syncPending.size)txt="Angemeldet als "+syncUser.email+" · wird synchronisiert …";
  else txt="Angemeldet als "+syncUser.email+(syncLast?" · synchronisiert ✓":" · wartet auf Verbindung");
  if($("syncStatus")){$("syncStatus").textContent=txt;$("syncBtn").textContent=syncUser?"Abmelden":"Anmelden";$("syncBtn").disabled=!syncOn()}
  const l=$("syncLine");if(l)l.textContent=!syncUser?"":(syncErr?"☁ "+syncErr:navigator.onLine===false?"☁ Offline – wird später synchronisiert":"☁ Mit der Cloud synchronisiert")}
function syncLogin(){
  sheet(`<h2>Anmelden</h2>
    <div class="muted small" style="line-height:1.5">Mit demselben Konto wie in deiner Grammatik-App. Danach werden Fortschritt, Streak, eigene Karten und Sammlungen automatisch zwischen deinen Geräten abgeglichen. Dein API-Schlüssel bleibt auf dem Gerät.</div>
    <label>E-Mail</label><input id="lgMail" type="email" enterkeyhint="next" autocomplete="username" autocorrect="off" autocapitalize="off" spellcheck="false">
    <label>Passwort</label><input id="lgPw" type="password" enterkeyhint="go" autocomplete="current-password">
    <div class="msg" id="lgMsg" style="margin-top:8px"></div>
    <div class="btns"><button class="secondary" id="lgCancel">Abbrechen</button><button class="primary" id="lgGo">Anmelden</button></div>
    <button class="small secondary" id="lgReset" style="width:100%;margin-top:12px">Passwort vergessen?</button>`);
  $("lgCancel").onclick=closeSheet;
  $("lgMail").focus();
  $("lgMail").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("lgPw").focus()}});
  $("lgPw").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("lgGo").click()}});
  $("lgReset").onclick=()=>{const m=$("lgMail").value.trim();if(!m){$("lgMsg").textContent="Bitte zuerst deine E-Mail eingeben.";return}
    FB.sendPasswordResetEmail(syncAuth,m).then(()=>{$("lgMsg").textContent="E-Mail zum Zurücksetzen wurde verschickt."}).catch(()=>{$("lgMsg").textContent="Das hat nicht geklappt. Stimmt die E-Mail?"})};
  $("lgGo").onclick=()=>{const m=$("lgMail").value.trim(),p=$("lgPw").value;if(!m||!p){$("lgMsg").textContent="Bitte E-Mail und Passwort eingeben.";return}
    $("lgMsg").textContent="Anmelden …";$("lgGo").disabled=true;
    FB.signInWithEmailAndPassword(syncAuth,m,p).then(()=>{closeSheet();toast("☁ Angemeldet")}).catch(e=>{const c=e&&e.code||"";$("lgGo").disabled=false;
      $("lgMsg").textContent=/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)?"E-Mail oder Passwort stimmt nicht.":c.includes("network")?"Keine Internetverbindung.":c.includes("unauthorized-domain")?"Diese Adresse ist in Firebase nicht freigegeben.":c.includes("too-many")?"Zu viele Versuche – bitte kurz warten.":"Anmeldung fehlgeschlagen ("+(c||"unbekannt")+")."})}}
function syncButton(){
  if(!syncOn())return;
  if(syncUser){if(!confirm("Abmelden? Deine Daten bleiben auf diesem Gerät, werden aber nicht mehr abgeglichen."))return;
    flushSync().finally(()=>{if(syncUnsub){syncUnsub();syncUnsub=null}FB.signOut(syncAuth);closeSheet();toast("Abgemeldet")})}
  else syncLogin()}
window.addEventListener("online",renderSync);window.addEventListener("offline",renderSync);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSync();else syncTryApply()});
if(window.FB){
  try{
    const app=FB.initializeApp(FB_CONFIG,"affarssvenska");
    syncAuth=FB.getAuth(app);
    try{syncDb=FB.initializeFirestore(app,{localCache:FB.persistentLocalCache({tabManager:FB.persistentSingleTabManager()})})}catch(e){syncDb=FB.initializeFirestore(app,{})}
    FB.onAuthStateChanged(syncAuth,u=>{syncUser=u;syncErr="";
      if(u){if(LS.get("as-sync-init-"+u.uid,0))startListener();else initialMerge()}
      else{if(syncUnsub){syncUnsub();syncUnsub=null}}
      renderSync()});
  }catch(e){syncAuth=null}
}
