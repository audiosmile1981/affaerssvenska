<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Affärssvenska">
<title>Affärssvenska</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6FA;--surface:#FFFFFF;--ink:#14233A;--muted:#5D6B80;--line:#D8E0EA;
  --blue:#1E5BB8;--blue-soft:#E3ECF8;--on-blue:#FFFFFF;--streak-bg:#1E5BB8;--streak-ink:#FFFFFF;--streak-dot:#FFFFFF;
  --ok:#1F8A55;--ok-soft:#E2F4EA;--bad:#C2413A;--bad-soft:#FBE7E5;--warn:#B7791F;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A2B;--surface:#17243A;--ink:#E9EEF6;--muted:#9AA8BC;--line:#2A3B57;
  --blue:#6FA2EE;--blue-soft:#1F3352;--on-blue:#0F1A2B;--streak-bg:#F3F6FA;--streak-ink:#14233A;--streak-dot:#1E5BB8;
  --ok:#4CC28A;--ok-soft:#173A2B;--bad:#EF7B73;--bad-soft:#3E1F1D;--warn:#E3B04B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A2B;--surface:#17243A;--ink:#E9EEF6;--muted:#9AA8BC;--line:#2A3B57;
  --blue:#6FA2EE;--blue-soft:#1F3352;--on-blue:#0F1A2B;--streak-bg:#F3F6FA;--streak-ink:#14233A;--streak-dot:#1E5BB8;
  --ok:#4CC28A;--ok-soft:#173A2B;--bad:#EF7B73;--bad-soft:#3E1F1D;--warn:#E3B04B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:12px 18px 32px}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;flex:none}
h1{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin:6px 0}
h2{font-size:1.2rem;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
/* Streak */
.streak{background:var(--streak-bg);color:var(--streak-ink);border-radius:22px;padding:18px 20px;margin:12px 0 16px}
.streak .big{font-size:2.3rem;font-weight:800;line-height:1}
.streak .lbl{font-size:.9rem;opacity:.85}
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;opacity:.9}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;opacity:.5}
.dot.on{background:var(--streak-dot);border-color:var(--streak-dot);opacity:1}
.dot.today{outline:2px solid currentColor;outline-offset:2px;opacity:1}
.goalbar{height:8px;border-radius:4px;background:rgba(127,127,127,.3);margin-top:14px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--streak-dot);width:0}
/* Kacheln */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 0;overflow:hidden;display:flex;flex-direction:column;min-height:150px}
.tile h3{margin:0 0 8px;font-size:.98rem;font-weight:700;line-height:1.25;flex:1}
.stats{display:grid;grid-template-columns:1fr auto;row-gap:2px;font-size:.82rem;margin-bottom:10px}
.stats span:nth-child(odd){color:var(--muted)}
.stats span:nth-child(even){font-weight:700;text-align:right}
.bar{height:5px;background:var(--blue-soft);margin:0 -14px}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.primary{width:100%;border:0;border-radius:18px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:1.05rem;padding:15px}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:600}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
/* Liste */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item b{display:block;font-weight:700}
.item span{color:var(--muted);font-size:.88rem}
.st{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.st.l{background:var(--warn)}.st.d{background:var(--ok)}
/* Karte */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px;text-align:center;touch-action:pan-y;transition:transform .2s}
.cardtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem;margin-bottom:10px}
.cardtop button{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px}
.de-word{font-size:1.6rem;font-weight:800;display:inline-block;border-bottom:3px solid var(--blue);padding-bottom:4px;line-height:1.25}
.de-word.w{font-size:1.2rem;font-weight:700}
.typ{font-size:.85rem;color:var(--muted);margin-left:6px}
.lemma{margin-top:12px;font-size:1.15rem;font-weight:700;color:var(--blue);min-height:1.5em}
.lemma small{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.old{display:inline-block;font-size:.75rem;color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.sv{font-size:1.22rem;line-height:1.7;margin:20px 0 8px}
.gap{font:inherit;font-weight:700;padding:2px 8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;max-width:100%}
.solo{width:100%;margin:18px 0 6px;font-size:1.15rem;padding:10px}
textarea.solo{min-height:84px;text-align:left;resize:vertical;font-weight:600}
.fill{font-weight:800;padding:0 4px;border-radius:6px}
.fill.ok{background:var(--ok-soft);color:var(--ok)}.fill.bad{background:var(--bad-soft);color:var(--bad)}
.dex{color:var(--muted);line-height:1.6}
.dex b{color:var(--ink)}
.answer{font-size:1.25rem;font-weight:700;margin:18px 0 6px;line-height:1.5}
.alts{color:var(--muted);font-size:.92rem;line-height:1.5}
.yours{font-size:.9rem;color:var(--muted);margin-top:8px}
.msg{min-height:1.3em;margin-top:10px;font-size:.9rem;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
.src{color:var(--muted);font-size:.8rem;margin-top:6px}
.tools{display:flex;justify-content:center;gap:10px;margin-top:14px}
.tool{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 14px;font-size:.9rem;font-weight:600}
.actions{margin-top:14px}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate button{border-radius:18px;padding:14px 6px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.rate .no{color:var(--bad)}.rate .yes{background:var(--ok);border-color:var(--ok);color:#fff}.rate .never{color:var(--muted);font-size:.9rem}
.hintrow{display:flex;justify-content:flex-end;margin-top:8px}
.hintrow button{background:none;border:0;color:var(--blue);font-weight:600;padding:6px}
.done{text-align:center;padding:40px 10px}
.done b{display:block;font-size:1.4rem;margin-bottom:8px}
/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.sheet textarea{min-height:64px;resize:vertical}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet .btns button{flex:1}
.danger{border:1px solid var(--bad);color:var(--bad);background:none;border-radius:14px;padding:12px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2);text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);line-height:1.5}
.stamp{position:absolute;left:50%;top:18px;transform:translateX(-50%) rotate(-8deg);z-index:5;pointer-events:none;opacity:0;font-weight:800;font-size:1.3rem;padding:6px 14px;border-radius:12px;border:3px solid currentColor;background:var(--surface);transition:opacity .1s}
.stamp.yes{color:var(--ok)}.stamp.no{color:var(--bad)}.stamp.never{color:var(--muted)}
.flagfield{display:flex;align-items:center;gap:8px}.flagfield .flag{font-size:1.5rem;line-height:1;flex:none}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.statbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.statbox b{display:block;font-size:1.7rem;font-weight:800;line-height:1.1}
.statbox span{color:var(--muted);font-size:.85rem}
.bars{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:10px}
.bars div{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars div.met{background:var(--ok)}
.barlbl{display:flex;gap:4px;font-size:.62rem;color:var(--muted);margin-top:4px}.barlbl span{flex:1;text-align:center}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--blue-soft);margin:8px 0 4px}
.stack i{display:block;height:100%}
table.st{width:100%;border-collapse:collapse;font-size:.9rem}table.st td,table.st th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}table.st td:first-child,table.st th:first-child{text-align:left}
.plant{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-size:.72rem;font-weight:700}
.plantlbl{white-space:nowrap}
.plant.grow svg{animation:grow .42s ease-out}.plant.wilt svg{animation:wilt .42s ease-out}
@keyframes grow{0%{transform:scale(.6)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes wilt{0%{transform:scale(1.2) rotate(-8deg)}100%{transform:scale(1)}}
.tw{cursor:pointer;text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px;border-radius:4px}
.tw:active,.tw-on{background:var(--blue-soft)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section id="vHome">
  <div class="row" style="justify-content:space-between">
    <h1>Affärssvenska</h1>
    <div class="row">
      <button class="icon-btn" id="statBtn" aria-label="Statistik">📊</button>
      <button class="icon-btn" id="themeBtn" aria-label="Daylight/Moonlight umschalten">🌙</button>
      <button class="icon-btn" id="setBtn" aria-label="Einstellungen">⚙︎</button>
    </div>
  </div>
  <div class="streak">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="big" id="sCur">0</div><div class="lbl" id="sCurLbl">Tage in Folge</div></div>
      <div style="text-align:right"><div class="lbl">Rekord</div><div style="font-weight:800;font-size:1.2rem" id="sBest">0</div></div>
    </div>
    <div class="goalbar"><i id="gBar"></i></div>
    <div class="lbl" style="margin-top:6px" id="gTxt"></div>
    <div class="week" id="week"></div>
  </div>
  <button class="primary" id="learnAll">Alle fälligen Karten lernen</button>
  <div class="row" style="margin-top:10px"><button class="secondary" id="newWord" style="flex:1;padding:14px 8px">＋ Neues Wort</button><button class="secondary" id="suggBtn" style="flex:1;padding:14px 8px">💡 Wortvorschläge</button></div>
  <button class="secondary" id="textBtn" style="width:100%;margin-top:10px;padding:14px">📄 Wörter aus Text (Stellenanzeige, Artikel …)</button>
  <div id="noData" class="empty hidden" style="margin-top:16px">Noch keine Buchkarten geladen.<br>Tippe auf ⚙︎ und dann auf „Karten laden“.</div>
  <div class="section-title"><h2>Sammlungen</h2><button class="secondary" id="newColl">+ Sammlung</button></div>
  <div class="grid" id="grid"></div>
</section>

<section id="vColl" class="hidden">
  <div class="row"><button class="icon-btn" id="collBack" aria-label="Zurück">‹</button><h2 id="collName" style="flex:1"></h2><button class="icon-btn" id="collRename" aria-label="Sammlung umbenennen">✎</button></div>
  <div class="row" style="margin-top:14px"><button class="primary" id="collLearn" style="flex:2">Lernen</button><button class="secondary" id="collAdd" style="flex:1;padding:15px 10px">+ Karte</button></div>
  <button class="secondary hidden" id="collFill" style="width:100%;margin-top:10px;padding:12px">✨ Sätze ergänzen</button>
  <div class="list" id="collList"></div>
  <button class="small secondary hidden" id="collReset" style="margin-top:14px;width:100%">Fortschritt dieser Sammlung zurücksetzen</button>
</section>

<section id="vStats" class="hidden">
  <div class="row"><button class="icon-btn" id="statBack" aria-label="Zurück">‹</button><h2 style="flex:1">Statistik</h2></div>
  <div id="statBody"></div>
</section>

<section id="vLearn" class="hidden">
  <div class="row" style="margin-bottom:12px"><button class="icon-btn" id="learnBack" aria-label="Zurück">‹</button>
    <div style="flex:1;height:32px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem" id="left"></div><button class="icon-btn" id="undoBtn" aria-label="Letzte Bewertung rückgängig machen" title="Rückgängig" disabled style="opacity:.35">↶</button></div>
  <div style="position:relative"><div class="stamp" id="stamp"></div></div>
  <div class="card" id="card"></div>
  <div class="hintrow" id="hintRow"><button id="hint">Hinweis</button></div>
  <div class="actions" id="actFront"><button class="primary" id="check">Aufdecken</button></div>
  <div class="actions rate hidden" id="actBack">
    <button class="no" id="rNo">✗ Nochmal</button><button class="never" id="rNever">Nie wieder</button><button class="yes" id="rYes">✓ Gewusst</button>
  </div>
  <div class="done hidden" id="done"><b>Geschafft!</b><span id="doneTxt">Für diese Auswahl sind heute keine Karten mehr fällig.</span><br><button class="secondary" id="donePractice" style="margin-top:16px">Freies Üben</button></div>
</section>

</div>
<div id="sheetRoot"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
const EMBEDDED = /*__DATA__*/null;
const CHAPTERS = {1:"Kap. 1 – Personalen. Kontoret.",2:"Kap. 2 – Att vara anställd. Besök på banken.",3:"Kap. 3 – Att samtala i telefon",4:"Kap. 4 – Samtal på arbetet",5:"Kap. 5 – Besök på en mässa",6:"Kap. 6 – Besök hos en tillverkare",7:"Kap. 7 – Presentation av ett företags verksamhet",8:"Kap. 8 – Eira sammanfattar sina intryck"};
const RV_CHAPTERS = {1:"Rivstart 1 – Arbetsmarknad och arbetstagare",2:"Rivstart 2 – Arbetsplatser",3:"Rivstart 3 – Arbetsplatskultur",4:"Rivstart 4 – Kundkontakt",5:"Rivstart 5 – Arbetsmiljö",6:"Rivstart 6 – Socialt på jobbet",7:"Rivstart 7 – Möten",8:"Rivstart 8 – Projekt och grupper"};
const FX_CHAPTERS = {1:"Lön & förmåner",2:"Anställning & arbetsrätt",3:"Skatt & myndigheter",4:"Ekonomi & redovisning",5:"Bank, finans & betalning",6:"Företagsformer & juridik",7:"Handel & marknad"};
const STEPS=[1,2,4,7,10,14], DAY=86400000;

// ---------- Speicher ----------
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let base = EMBEDDED || LS.get("as-data",[]);
let user = Object.assign({cards:[],colls:[],edits:{},deleted:[],names:{}}, LS.get("as-user",{}));
let prog = LS.get("as-prog",{});
let streak = Object.assign({goal:30,days:{},best:0}, LS.get("as-streak",{}));
const saveUser=()=>LS.set("as-user",user), saveProg=()=>LS.set("as-prog",prog), saveStreak=()=>LS.set("as-streak",streak);

function allCards(){
  const del=new Set(user.deleted);
  const b=base.filter(c=>!del.has(c.id)).map(c=>user.edits[c.id]?Object.assign({},c,user.edits[c.id]):c);
  return b.concat(user.cards);
}
function collections(){
  const cs=allCards(), out=[];
  const ks=[...new Set(cs.filter(c=>c.k!=null&&!c.b&&!c.coll).map(c=>c.k))].sort((a,b)=>a-b);
  ks.forEach(k=>out.push({id:"k"+k,book:"Affärssvenska",name:user.names["k"+k]||CHAPTERS[k]||("Kap. "+k),match:c=>c.k===k&&!c.b&&!c.coll}));
  const rs=[...new Set(cs.filter(c=>c.b==="rv"&&!c.coll).map(c=>c.k))].sort((a,b)=>a-b);
  rs.forEach(k=>out.push({id:"rv"+k,book:"Rivstart Yrkesliv",name:user.names["rv"+k]||RV_CHAPTERS[k]||("Rivstart "+k),match:c=>c.b==="rv"&&c.k===k&&!c.coll}));
  const fs=[...new Set(cs.filter(c=>c.b==="fx"&&!c.coll).map(c=>c.k))].sort((a,b)=>a-b);
  fs.forEach(k=>out.push({id:"fx"+k,book:"Fortnox-Begriffe",name:user.names["fx"+k]||FX_CHAPTERS[k]||("Fortnox "+k),match:c=>c.b==="fx"&&c.k===k&&!c.coll}));
  user.colls.forEach(col=>out.push({id:col.id,book:"Eigene Sammlungen",name:col.name,own:true,match:c=>c.coll===col.id}));
  return out;
}
// ---------- Zeit & Streak ----------
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
function curStreak(){
  let n=0,d=new Date();d.setHours(12,0,0,0);
  if(!(streak.days[dkey(d)]||{}).met) d.setDate(d.getDate()-1);
  while((streak.days[dkey(d)]||{}).met){n++;d.setDate(d.getDate()-1)}
  return n;
}
function countToday(){
  const k=dkey(Date.now()), t=streak.days[k]||{n:0,met:false};
  t.n++; let hit=false;
  if(!t.met && (t.n>=streak.goal || allCards().filter(isDue).length===0)){t.met=true;hit=true}
  streak.days[k]=t; streak.best=Math.max(streak.best,curStreak()); saveStreak();
  if(hit){fanfare();toast("Tagesziel erreicht! 🎉<br><span style='font-weight:500'>"+curStreak()+" Tag(e) in Folge</span>")}
}
// ---------- Status einer Karte ----------
const st=c=>prog[c.id];
const isDue=c=>{const s=st(c);return !s||(!s.done&&s.due<=today0())};
function statsOf(cs){let n=0,l=0,d=0;cs.forEach(c=>{const s=st(c);if(!s)n++;else if(s.done)d++;else l++});return {n,l,d}}

// ---------- Hilfen ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const bold=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:„“"”'’–-]/g," ").replace(/\s+/g," ").trim();
const plain=s=>norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const core=c=>c.sv.replace(/^\((en|ett)\)\s*/,"").replace(/^(en|ett)\s+/,"").replace(/\s*\(.*?\)\s*/g," ").split("/")[0].trim();
function answerOf(c){
  if(c.t==="w") return [c.sv].concat(c.alt||[]);
  const m=c.s&&c.s.match(/\{(.+?)\}/); if(m) return [m[1]];
  const k=core(c); return [k, c.sv.replace(/\s*\(.*?\)\s*/g," ").trim()];
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array(n+1).fill(0).map((_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function grade(c,typed){
  if(!typed.trim()) return "none";
  const ans=answerOf(c);
  if(ans.some(a=>norm(a)===norm(typed))) return "ok";
  if(ans.some(a=>plain(a)===plain(typed))) return "warn";
  if(c.t==="w" && ans.some(a=>{const x=plain(a),y=plain(typed);return lev(x,y)<=Math.max(2,Math.round(x.length*.12))})) return "close";
  return "bad";
}

let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(actx.state==="suspended")actx.resume();return actx}
function unlockAudio(){const a=ac();if(!a)return;const b=a.createBuffer(1,1,22050),s=a.createBufferSource();s.buffer=b;s.connect(a.destination);s.start(0)}
["touchstart","click"].forEach(ev=>document.addEventListener(ev,unlockAudio,{once:true,passive:true}));
function tone(f,t0,dur,type,vol,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),s=a.currentTime+t0;
  o.type=type||"sine";o.frequency.setValueAtTime(f,s);if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+dur);
  g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol||.2,s+.015);g.gain.exponentialRampToValueAtTime(.001,s+dur);o.connect(g).connect(a.destination);o.start(s);o.stop(s+dur+.05)}
function sfx(k){try{
  if(k==="yes"){tone(659.25,0,.14,"sine",.22);tone(987.77,.09,.2,"sine",.2)}
  else if(k==="no"){tone(220,0,.22,"triangle",.25,150)}
  else if(k==="never"){tone(440,0,.12,"sine",.15,330)}
  else if(k==="undo"){tone(523.25,0,.1,"sine",.15);tone(392,.08,.14,"sine",.15)}}catch(e){}}
function fanfare(){try{
  const n=[[523.25,0,.18],[659.25,.16,.18],[783.99,.32,.18],[1046.5,.5,.5],[783.99,.78,.14],[1046.5,.92,.7]];
  n.forEach(([f,t0,d])=>{tone(f,t0,d,"triangle",.22);tone(f/2,t0,d,"sine",.12)})}catch(e){}}

function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("sv"));const os=vs.filter(v=>/oskar/i.test(v.name));voice=os.find(v=>/förbättrad|enhanced|premium/i.test(v.name))||os[0]||vs[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){if(!("speechSynthesis" in window))return;if(!voice||!/oskar/i.test(voice.name))pickVoice();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";if(voice)u.voice=voice;speechSynthesis.speak(u)}

const MODELS=["claude-haiku-5-5","claude-sonnet-5-5"];

{"sv":"ett företag","de":"Unternehmen","typ":"Subst.","info":"-","s":"Hon har arbetat på samma {företag} i tio år.","d":"Sie arbeitet seit zehn Jahren in **demselben Unternehmen**."}
"typ" ist eines von: Subst., Verb, Partikelverb, Adj., Adv., Ausdruck, Verbausdruck.`;

async function askJSON(key,prompt,list){
  let last="",tries=0,noThink=true;
  const order=[MODELS[0],MODELS[0],MODELS[1],MODELS[1]];
  for(let mi=0;mi<order.length;mi++){const model=order[mi];
    if(mi%2===1&&!/stop_reason/.test(last)&&last)continue;
    let r;
    try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify(Object.assign({model,max_tokens:list?8000:3000,messages:[{role:"user",content:prompt}]},noThink?{thinking:{type:"disabled"}}:{}))})}
    catch(e){throw new Error("Keine Verbindung. Bist du online?")}
    if(r.status===401)throw new Error("Der API-Schlüssel stimmt nicht. Bitte unter ⚙︎ prüfen.");
    if(r.status===402||r.status===403)throw new Error("Kein Guthaben oder kein Zugriff. Bitte in der Console prüfen.");
    if(r.status===429)throw new Error("Zu viele Anfragen. Bitte kurz warten.");
    if(r.status===400&&noThink){const b=await r.text();if(/thinking/i.test(b)){noThink=false;mi--;continue}last=b}
    if(r.status===404||r.status===400){last=last||await r.text();if(/model/i.test(last)){mi+=(mi%2===0?1:0);continue}throw new Error("Anfrage abgelehnt: "+last.slice(0,160))}
    const raw=await r.text();
    if(!r.ok)throw new Error("Fehler "+r.status+": "+raw.slice(0,160));
    let j=null;try{j=JSON.parse(raw)}catch(e){throw new Error("Antwort nicht lesbar (Status "+r.status+", "+raw.length+" Zeichen): "+raw.slice(0,160))}
    const txt=(j.content||[]).filter(x=>x.type==="text").map(x=>x.text||"").join("").replace(/```json|```/g,"").trim();
    const m=txt.match(list?/\[[\s\S]*\]/:/\{[\s\S]*\}/);
    let o=null;if(m){try{o=JSON.parse(m[0])}catch(e){}}
    if(list){if(Array.isArray(o)&&o.length)return o;last="Modell "+model+", stop_reason "+(j.stop_reason||"?")+": "+(txt||"").slice(0,160);if(++tries<3)continue;throw new Error("Keine brauchbare Antwort. Details: "+last)}
    if(!o||!o.s||!/\{.+?\}/.test(o.s)){last="Modell "+model+", stop_reason "+(j.stop_reason||"?")+": "+(txt||JSON.stringify(j)).slice(0,160);if(++tries<3)continue;throw new Error("Kein brauchbarer Satz. Details: "+last)}
    return o;
  }
  throw new Error("Kein passendes Modell gefunden. Details: "+String(last).slice(0,160));
}

async function fillSentences(colId){
  const key=LS.get("as-key","");if(!key){alert("Bitte zuerst unter ⚙︎ deinen API-Schlüssel eintragen.");return}
  const col=getColl(colId),todo=allCards().filter(col.match).filter(c=>c.t==="v"&&!c.s);
  if(!todo.length)return;
  const b=$("collFill");b.disabled=true;let done=0,fail=0;
  for(let i=0;i<todo.length;i+=8){
    const part=todo.slice(i,i+8);b.textContent=`Erzeuge Sätze … ${Math.min(i+8,todo.length)} / ${todo.length}`;
    try{const res=await genBatch(key,part,col.name);
      part.forEach((c,j)=>{const o=res[j];if(!o||!o.s||!/\{.+?\}/.test(o.s)){fail++;return}
        const upd={s:o.s,d:o.d||"",ki:true};
        const uc=user.cards.find(x=>x.id===c.id);if(uc)Object.assign(uc,upd);else user.edits[c.id]=Object.assign({},user.edits[c.id]||{},upd);done++});

    }catch(e){fail+=part.length;if(/Schlüssel|Guthaben|Verbindung/.test(e.message)){alert(e.message);break}}

  b.disabled=false;renderColl();toast(done+" Sätze ergänzt"+(fail?` · ${fail} nicht geklappt`:""));
}

    el.style.boxShadow=Math.abs(dx)>15?`0 0 0 3px ${dx>0?"var(--ok)":"var(--bad)"}`:""},{passive:true});
  el.addEventListener("touchend",()=>{if(x0==null)return;x0=null;el.style.boxShadow="";
    if(dx>90)rate("yes");else if(dx<-90)rate("no");else{el.style.transition="transform .2s";el.style.transform="";stamp(null)}});})();

// ---------- Bearbeiten / Anlegen ----------
function sheet(html){const r=$("sheetRoot");r.innerHTML=`<div class="sheet-bg"><div class="sheet">${html}</div></div>`;
  r.firstChild.addEventListener("click",e=>{if(e.target===r.firstChild)closeSheet()});return r}
const closeSheet=()=>{$("sheetRoot").innerHTML=""};
function makeGap(sentence,form,c){
  if(!sentence.trim())return "";
  if(/\{.+?\}/.test(sentence))return sentence;
  const tryWrap=w=>{if(!w)return null;const i=sentence.toLowerCase().indexOf(w.toLowerCase());return i<0?null:sentence.slice(0,i)+"{"+sentence.slice(i,i+w.length)+"}"+sentence.slice(i+w.length)};
  let r=tryWrap(form.trim());if(r)return r;if(form.trim())return null;
  const k=core(c),rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(!k.includes(" ")){for(const stem of [k,k.slice(0,Math.max(3,k.length-1))]){const m=sentence.match(new RegExp("(^|[^\\p{L}])("+rx(stem)+"\\p{L}*)","iu"));if(m)return tryWrap(m[2])}}
  r=tryWrap(k);if(r)return r;
  return null;
}
function editCard(c,fromLearn){
  const isNew=!c.id, isUser=isNew||user.cards.some(x=>x.id===c.id);
  const g=c.s?(c.s.match(/\{(.+?)\}/)||[])[1]||"":"";
  sheet(`<h2>${isNew?"Neue Karte":"Karte bearbeiten"}</h2>
   ${c.pick?`<label>Sammlung</label><select id="eColl">${collections().map(x=>`<option value="${x.id}"${x.id===c.pick?" selected":""}>${esc(x.name)}</option>`).join("")}${user.colls.some(x=>x.name==="Meine Wörter")?"":`<option value="__new__"${c.pick==="__new__"?" selected":""}>Meine Wörter (neu)</option>`}</select>`:""}
   <label>Kartentyp</label><select id="eT"><option value="v"${c.t!=="w"?" selected":""}>Vokabel</option><option value="w"${c.t==="w"?" selected":""}>Wendung</option></select>
   <label id="lSv">Schwedisch (mit en/ett)</label><div class="flagfield"><span class="flag" aria-hidden="true">🇸🇪</span><input id="eSv" value="${esc(c.sv)}" autocapitalize="off"></div>
   <label id="lDe">Deutsch</label><div class="flagfield"><span class="flag" aria-hidden="true">🇩🇪</span><input id="eDe" value="${esc(c.de)}"></div>
   <div id="genRow"><button class="secondary" id="eGen" type="button" style="width:100%;margin-top:10px">✨ Satz generieren</button><div class="muted small" id="genMsg" style="margin-top:6px"></div></div>
   <div id="vOnly">
     <label>Pluralendung / Konjugation (optional)</label><input id="eInfo" value="${esc(c.info)}">
     <label>Wortart</label><select id="eTyp">${["Subst.","Verb","Partikelverb","Adj.","Adv.","Ausdruck","Verbausdruck"].map(o=>`<option${o===c.typ?" selected":""}>${o}</option>`).join("")}</select>
     <label>Schwedischer Beispielsatz (optional)</label><div class="flagfield"><span class="flag" aria-hidden="true">🇸🇪</span><textarea id="eS">${esc((c.s||"").replace(/[{}]/g,""))}</textarea></div>
     <label>Wort im Satz, falls gebeugt (z. B. „uppsägningen“)</label><input id="eForm" value="${esc(g)}" autocapitalize="off">
     <label>Deutsche Übersetzung des Satzes</label><div class="flagfield"><span class="flag" aria-hidden="true">🇩🇪</span><textarea id="eD">${esc(c.d||"")}</textarea></div>
     <button class="secondary" id="eTr" type="button" style="width:100%;margin-top:10px">🔁 Satz übersetzen</button><div class="muted small" id="trMsg" style="margin-top:6px"></div><div class="muted small" style="margin-top:4px">Fettdruck: Text zwischen zwei Sternchenpaare setzen, z. B. **die U-Bahn**</div>
   </div>
   <div id="wOnly"><label>Weitere mögliche Antworten (eine pro Zeile)</label><textarea id="eAlt">${esc((c.alt||[]).join("\n"))}</textarea></div>
   <label>Notiz (optional)</label><input id="eNote" value="${esc(c.note)}">
   <div class="btns"><button class="secondary" id="eCancel">Abbrechen</button><button class="primary" id="eSave">Speichern</button></div>
   ${isNew?"":`<button class="danger" id="eDel" style="width:100%;margin-top:14px">Karte löschen</button>`}`);
  let generated=!!c.ki;
  $("eGen").onclick=async()=>{
    const word=$("eSv").value.trim()||$("eDe").value.trim();
    if(!word){$("genMsg").textContent="Bitte zuerst das Wort eintragen.";return}
    const key=LS.get("as-key","");
    if(!key){$("genMsg").textContent="Bitte zuerst unter ⚙︎ deinen API-Schlüssel eintragen.";return}
    const b=$("eGen");b.disabled=true;b.textContent="Erzeuge Satz …";$("genMsg").textContent="";
    try{const col=c.coll?getColl(c.coll):(c.k?getColl("k"+c.k):null);
      const o=await genSentence(key,word,$("eDe").value.trim(),col?col.name:"");
      $("eSv").value=o.sv||word;if(!$("eDe").value.trim())$("eDe").value=o.de||"";
      $("eInfo").value=o.info||"";if(o.typ)$("eTyp").value=o.typ;
      const m=(o.s||"").match(/\{(.+?)\}/);$("eS").value=(o.s||"").replace(/[{}]/g,"");$("eForm").value=m?m[1]:"";
      $("eD").value=o.d||"";generated=true;$("genMsg").textContent="Fertig – bitte kurz prüfen. Mit dem Knopf bekommst du einen anderen Satz.";
    }catch(e){$("genMsg").textContent=e.message||"Das hat nicht geklappt. Bitte noch einmal versuchen."}
    b.disabled=false;b.textContent="✨ Anderen Satz generieren";
  };
  let lastEdited="";$("eS").addEventListener("input",()=>lastEdited="sv");$("eD").addEventListener("input",()=>lastEdited="de");
  $("eTr").onclick=async()=>{
    const sv=$("eS").value.trim(),dt=$("eD").value.trim(),word=$("eSv").value.trim()||$("eDe").value.trim();
    if(!sv&&!dt){$("trMsg").textContent="Bitte zuerst einen schwedischen oder deutschen Satz eintragen.";return}
    if(!word){$("trMsg").textContent="Bitte oben zuerst das Lernwort eintragen.";return}
    const key=LS.get("as-key","");if(!key){$("trMsg").textContent="Bitte zuerst unter ⚙︎ deinen API-Schlüssel eintragen.";return}
    const dir=sv&&!dt?"sv2de":dt&&!sv?"de2sv":(lastEdited==="de"?"de2sv":"sv2de");
    const b=$("eTr");b.disabled=true;b.textContent="Übersetze …";$("trMsg").textContent="";
    try{const o=await translateSentence(key,word,$("eDe").value.trim(),sv,dt.replace(/\*\*/g,""),dir);
      const m=(o.s||"").match(/\{(.+?)\}/);$("eS").value=(o.s||"").replace(/[{}]/g,"");$("eForm").value=m?m[1]:"";$("eD").value=o.d||"";
      if(dir==="de2sv")generated=true;lastEdited="";
      $("trMsg").textContent=dir==="sv2de"?"Ins Deutsche übersetzt – bitte kurz prüfen.":"Ins Schwedische übersetzt – bitte kurz prüfen.";
    }catch(e){$("trMsg").textContent=e.message||"Das hat nicht geklappt. Bitte noch einmal versuchen."}
    b.disabled=false;b.textContent="🔁 Satz übersetzen";
  };
  const sync=()=>{const w=$("eT").value==="w";$("vOnly").classList.toggle("hidden",w);$("wOnly").classList.toggle("hidden",!w);$("genRow").classList.toggle("hidden",w);
    $("lDe").textContent=w?"Situation auf Deutsch":"Deutsch";$("lSv").textContent=w?"Schwedische Wendung":"Schwedisch (mit en/ett)"};
  $("eT").onchange=sync;sync();$("eCancel").onclick=closeSheet;
  $("eSave").onclick=()=>{
    const t=$("eT").value,n={t,de:$("eDe").value.trim(),sv:$("eSv").value.trim(),note:$("eNote").value.trim()};
    if(!n.de||!n.sv){alert("Bitte Deutsch und Schwedisch ausfüllen.");return}
    if(t==="w"){Object.assign(n,{typ:"Wendung",info:"",s:"",d:"",alt:$("eAlt").value.split("\n").map(x=>x.trim()).filter(Boolean)})}
    else{n.info=$("eInfo").value.trim();n.typ=$("eTyp").value;n.alt=[];
      const s=makeGap($("eS").value.trim(),$("eForm").value,n);
      if(s===null){alert("Ich finde das Wort nicht im Satz. Bitte trag unter „Wort im Satz“ genau die Form ein, die im Satz steht.");return}
      n.s=s;let d=$("eD").value.trim();
      // fettes Wort in der Übersetzung: Deutsch-Wort markieren, falls vorhanden
      const dw=n.de.split(",")[0].trim();if(d&&dw&&!d.includes("**")){const i=d.toLowerCase().indexOf(dw.toLowerCase());if(i>=0)d=d.slice(0,i)+"**"+d.slice(i,i+dw.length)+"**"+d.slice(i+dw.length)}
      n.d=s?d:""}
    if(generated&&t==="v")n.ki=true;
    if(isNew&&c.pick){let cid=$("eColl").value;
      if(cid==="__new__"){cid="c"+Date.now().toString(36);user.colls.push({id:cid,name:"Meine Wörter"})}
      LS.set("as-lastcoll",cid);
      if(/^(k|rv|fx)\d+$/.test(cid)&&!user.colls.some(x=>x.id===cid)){c.k=+cid.replace(/^(rv|fx|k)/,"");c.b=(cid.match(/^(rv|fx)/)||[])[1];c.coll=undefined}else{c.coll=cid;c.k=undefined;c.b=undefined}}
    if(isNew){n.id="u"+Date.now().toString(36);n.coll=c.coll;n.k=c.k;if(c.b)n.b=c.b;user.cards.push(n)}
    else if(isUser){Object.assign(user.cards.find(x=>x.id===c.id),n)}
    else user.edits[c.id]=n;
    saveUser();closeSheet();if(c.pick){renderHome();toast(c.autoCtx?"Karte gespeichert – du lernst sie später":"Karte gespeichert")}else afterEdit(fromLearn,c.id);
  };
  if(c.autoCtx){
    $("eForm").value=c.autoCtx.word;
    const key=LS.get("as-key","");
    if(!key){$("genMsg").textContent="Ohne API-Schlüssel bitte Grundform, Deutsch und Übersetzung selbst ergänzen (⚙︎ → Schlüssel eintragen).";}
    else{const b=$("eGen");b.disabled=true;b.textContent="Erkenne Wort …";
      genFromContext(key,c.autoCtx.word,c.autoCtx.sentence).then(o=>{
        $("eSv").value=o.sv||c.autoCtx.word;$("eDe").value=o.de||"";$("eInfo").value=o.info||"";if(o.typ)$("eTyp").value=o.typ;
        const m=(o.s||"").match(/\{(.+?)\}/);$("eS").value=(o.s||c.autoCtx.sentence).replace(/[{}]/g,"");$("eForm").value=m?m[1]:c.autoCtx.word;$("eD").value=o.d||"";
        $("genMsg").textContent="Fertig – mit dem Satz, in dem du das Wort gefunden hast. Bitte kurz prüfen.";
      }).catch(e=>{$("genMsg").textContent=e.message||"Das hat nicht geklappt. Bitte die Felder selbst ergänzen."})
      .finally(()=>{b.disabled=false;b.textContent="✨ Anderen Satz generieren"})}
  }
  if(!isNew)$("eDel").onclick=()=>{if(!confirm("Diese Karte wirklich löschen?"))return;
    if(isUser)user.cards=user.cards.filter(x=>x.id!==c.id);else user.deleted.push(c.id);
    delete prog[c.id];saveProg();saveUser();closeSheet();
    if(fromLearn){queue=queue.filter(x=>x.id!==c.id);next()}else renderColl()};
}
function afterEdit(fromLearn,id){
  if(fromLearn){const nc=allCards().find(x=>x.id===id);if(nc){queue[0]=nc;cur=nc;const was=revealed;revealed=false;next();if(was){/* neu anzeigen */}}}
  else renderColl();
}
function newColl(){
  sheet(`<h2>Neue Sammlung</h2><label>Name</label><input id="cName" placeholder="z. B. Aus dem Job">
   <div class="btns"><button class="secondary" id="cCancel">Abbrechen</button><button class="primary" id="cSave">Erstellen</button></div>`);
  $("cName").focus();$("cCancel").onclick=closeSheet;
  $("cSave").onclick=()=>{const n=$("cName").value.trim();if(!n)return;const id="c"+Date.now().toString(36);user.colls.push({id,name:n});saveUser();closeSheet();openColl(id)};
}
function renameColl(){
  const col=getColl(curColl);
  sheet(`<h2>Sammlung umbenennen</h2><label>Name</label><input id="cName" value="${esc(col.name)}">
   <div class="btns"><button class="secondary" id="cCancel">Abbrechen</button><button class="primary" id="cSave">Speichern</button></div>
   ${col.own?'<button class="danger" id="cDel" style="width:100%;margin-top:14px">Sammlung mit allen Karten löschen</button>':""}`);
  $("cCancel").onclick=closeSheet;
  $("cSave").onclick=()=>{const n=$("cName").value.trim();if(!n)return;
    if(col.own)user.colls.find(x=>x.id===col.id).name=n;else user.names[col.id]=n;saveUser();closeSheet();renderColl()};
  if(col.own)$("cDel").onclick=()=>{if(!confirm("Sammlung und alle ihre Karten löschen?"))return;
    user.cards=user.cards.filter(c=>c.coll!==col.id);user.colls=user.colls.filter(x=>x.id!==col.id);saveUser();closeSheet();show("vHome");renderHome()};
}
function settings(){
  sheet(`<h2>Einstellungen</h2>
   <label>Tagesziel (Karten pro Tag)</label><input id="sGoal" type="number" min="1" max="500" value="${streak.goal}">
   <label>Buchkarten</label><div class="muted small" style="line-height:1.5">${base.length} Karten ${EMBEDDED?"(fest eingebaut)":"geladen"}.</div>
   ${EMBEDDED?"":'<button class="secondary" id="sLoad" style="width:100%;margin-top:8px">Karten laden (Datei)</button>'}
   <label>Kartenwerkstatt</label><div class="muted small" style="line-height:1.5">Eigene Wörter mit KI-Sätzen erstellst du in der <a href="https://claude.ai/artifact/3pAhjix3ocXyFfxuupeEUY" target="_blank" rel="noopener" style="color:var(--blue)">Kartenwerkstatt auf claude.ai</a>.</div>
   <button class="secondary" id="sWerk" style="width:100%;margin-top:8px">Werkstatt-Karten importieren</button>
   <label>Anthropic-API-Schlüssel (für „Satz generieren“)</label><input id="sKey" type="password" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="sk-ant-…" value="${esc(LS.get("as-key",""))}">
   <div class="muted small" style="margin-top:4px;line-height:1.5">Wird nur auf diesem Gerät gespeichert.</div>
   <label>Sicherung</label>
   <button class="secondary" id="sExport" style="width:100%">Eigene Karten & Fortschritt sichern</button>
   <button class="secondary" id="sImport" style="width:100%;margin-top:10px">Sicherung wiederherstellen</button>
   <div class="btns"><button class="primary" id="sSave">Fertig</button></div>`);
  $("sSave").onclick=()=>{LS.set("as-key",$("sKey").value.trim());const v=parseInt($("sGoal").value,10);if(v>0){streak.goal=v;const t=streak.days[dkey(Date.now())];if(t&&!t.met&&t.n>=v)t.met=true;saveStreak()}closeSheet();renderHome()};
  if($("sLoad"))$("sLoad").onclick=()=>{fileMode="data";$("fileIn").click()};
  $("sImport").onclick=()=>{fileMode="backup";$("fileIn").click()};
  $("sWerk").onclick=()=>{fileMode="werkstatt";$("fileIn").click()};
  $("sExport").onclick=()=>{const blob=new Blob([JSON.stringify({backup:1,user,prog,streak})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="affarssvenska-sicherung-"+dkey(Date.now())+".json";document.body.appendChild(a);a.click();a.remove()};
}
let fileMode="data";
$("fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);
    if(j.werkstatt){if(!Array.isArray(j.cards))throw 0;const name=(j.collection||"Kartenwerkstatt").trim();
      let col=user.colls.find(x=>x.name===name);if(!col){col={id:"c"+Date.now().toString(36),name};user.colls.push(col)}
      j.cards.forEach((c,i)=>{if(!c.de||!c.sv)return;user.cards.push({id:"u"+Date.now().toString(36)+i,t:"v",de:c.de,sv:c.sv,info:c.info||"",typ:c.typ||"Subst.",s:c.s||"",d:c.d||"",alt:[],note:"",ki:!!c.ki,coll:col.id})});
      saveUser();toast(j.cards.length+" Karten in „"+esc(name)+"“ importiert")}
    else if(fileMode==="backup"){if(!j.backup)throw 0;user=Object.assign(user,j.user);prog=j.prog||{};streak=Object.assign(streak,j.streak);saveUser();saveProg();saveStreak();toast("Sicherung wiederhergestellt")}
    else{const arr=Array.isArray(j)?j:j.cards;if(!Array.isArray(arr))throw 0;base=arr;LS.set("as-data",arr);toast(arr.length+" Karten geladen")}
    closeSheet();renderHome()}catch(x){alert("Die Datei konnte nicht gelesen werden.")}};
  r.readAsText(f);e.target.value=""};

// ---------- Verdrahtung ----------
function setTheme(t){document.documentElement.dataset.theme=t;$("themeBtn").textContent=t==="dark"?"☀️":"🌙";LS.set("as-theme",t)}
setTheme(LS.get("as-theme","light"));
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("setBtn").onclick=settings;
$("newWord").onclick=()=>{const last=LS.get("as-lastcoll","");const ok=collections().some(x=>x.id===last);
  const mw=user.colls.find(x=>x.name==="Meine Wörter");
  editCard({t:"v",de:"",sv:"",info:"",typ:"Subst.",s:"",d:"",pick:ok?last:(mw?mw.id:"__new__")})};$("newColl").onclick=newColl;
$("learnAll").onclick=()=>{allCards().some(isDue)?startLearn(()=>true,"vHome"):startPractice(()=>true,"vHome")};
let lastFilter=()=>true;
$("donePractice").onclick=()=>startPractice(lastFilter,from);
$("collBack").onclick=()=>{show("vHome");renderHome()};
$("collRename").onclick=renameColl;
$("collLearn").onclick=()=>{const col=getColl(curColl);const f=col.match;allCards().filter(f).some(isDue)?startLearn(f,"vColl"):(lastFilter=f,startPractice(f,"vColl"))};
$("collAdd").onclick=()=>{const col=getColl(curColl);const bk=(col.id.match(/^(rv|fx)\d/)||[])[1];editCard({t:"v",de:"",sv:"",info:"",typ:"Subst.",s:"",d:"",coll:col.own?col.id:undefined,k:col.own?undefined:+col.id.replace(/^(rv|fx|k)/,""),b:bk})};
$("collReset").onclick=()=>{if(!confirm("Fortschritt nur für diese Sammlung zurücksetzen?"))return;allCards().filter(getColl(curColl).match).forEach(c=>delete prog[c.id]);saveProg();renderColl()};
$("learnBack").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}show(from);from==="vColl"?renderColl():renderHome()};
$("check").onclick=reveal;$("hint").onclick=hint;
$("undoBtn").onclick=undo;
$("card").addEventListener("click",e=>{const w=e.target.closest&&e.target.closest(".tw");if(!w||!revealed||busy)return;
  const box=w.closest(".sv,.answer");const sentence=(box?box.textContent:"").replace(/\s+/g," ").trim();
  w.classList.add("tw-on");setTimeout(()=>w.classList.remove("tw-on"),400);wordCard(w.dataset.w,sentence)});
$("suggBtn").onclick=suggestSheet;
$("textBtn").onclick=textSheet;
$("collFill").onclick=()=>{const col=getColl(curColl);const n=allCards().filter(col.match).filter(c=>c.t==="v"&&!c.s).length;if(confirm(`Für ${n} Karten Beispielsätze erzeugen? Das nutzt dein API-Guthaben (grob ${Math.max(1,Math.round(n*0.05))} Cent).`))fillSentences(curColl)};
$("statBtn").onclick=()=>{renderStats();show("vStats")};
$("statBack").onclick=()=>{show("vHome");renderHome()};
$("rYes").onclick=()=>rate("yes");$("rNo").onclick=()=>rate("no");$("rNever").onclick=()=>rate("never");
document.addEventListener("click",()=>{if(actx&&actx.state==="suspended")actx.resume()},{once:true});
renderHome();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
