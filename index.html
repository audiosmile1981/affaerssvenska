<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Affärssvenska">
<title>Affärssvenska</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F3F6FA;--surface:#FFFFFF;--ink:#14233A;--muted:#5D6B80;--line:#D8E0EA;
  --blue:#1E5BB8;--blue-soft:#E3ECF8;--on-blue:#FFFFFF;--streak-bg:#1E5BB8;--streak-ink:#FFFFFF;--streak-dot:#FFFFFF;
  --ok:#1F8A55;--ok-soft:#E2F4EA;--bad:#C2413A;--bad-soft:#FBE7E5;--warn:#B7791F;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1A2B;--surface:#17243A;--ink:#E9EEF6;--muted:#9AA8BC;--line:#2A3B57;
  --blue:#6FA2EE;--blue-soft:#1F3352;--on-blue:#0F1A2B;--streak-bg:#F3F6FA;--streak-ink:#14233A;--streak-dot:#1E5BB8;
  --ok:#4CC28A;--ok-soft:#173A2B;--bad:#EF7B73;--bad-soft:#3E1F1D;--warn:#E3B04B;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1A2B;--surface:#17243A;--ink:#E9EEF6;--muted:#9AA8BC;--line:#2A3B57;
  --blue:#6FA2EE;--blue-soft:#1F3352;--on-blue:#0F1A2B;--streak-bg:#F3F6FA;--streak-ink:#14233A;--streak-dot:#1E5BB8;
  --ok:#4CC28A;--ok-soft:#173A2B;--bad:#EF7B73;--bad-soft:#3E1F1D;--warn:#E3B04B;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:540px;margin:0 auto;padding:12px 18px 32px}
.hidden{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;flex:none}
h1{font-size:1.8rem;font-weight:800;letter-spacing:-.02em;margin:6px 0}
h2{font-size:1.2rem;font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
/* Streak */
.streak{background:var(--streak-bg);color:var(--streak-ink);border-radius:22px;padding:18px 20px;margin:12px 0 16px}
.streak .big{font-size:2.3rem;font-weight:800;line-height:1}
.streak .lbl{font-size:.9rem;opacity:.85}
.week{display:flex;justify-content:space-between;margin-top:14px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;opacity:.9}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid currentColor;opacity:.5}
.dot.on{background:var(--streak-dot);border-color:var(--streak-dot);opacity:1}
.dot.today{outline:2px solid currentColor;outline-offset:2px;opacity:1}
.goalbar{height:8px;border-radius:4px;background:rgba(127,127,127,.3);margin-top:14px;overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--streak-dot);width:0}
/* Kacheln */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 14px 0;overflow:hidden;display:flex;flex-direction:column;min-height:150px}
.tile h3{margin:0 0 8px;font-size:.98rem;font-weight:700;line-height:1.25;flex:1}
.stats{display:grid;grid-template-columns:1fr auto;row-gap:2px;font-size:.82rem;margin-bottom:10px}
.stats span:nth-child(odd){color:var(--muted)}
.stats span:nth-child(even){font-weight:700;text-align:right}
.bar{height:5px;background:var(--blue-soft);margin:0 -14px}
.bar i{display:block;height:100%;background:var(--blue);width:0}
.primary{width:100%;border:0;border-radius:18px;background:var(--blue);color:var(--on-blue);font-weight:700;font-size:1.05rem;padding:15px}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;font-weight:600}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
/* Liste */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:14px}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.item:last-child{border-bottom:0}
.item .t{flex:1;min-width:0}
.item b{display:block;font-weight:700}
.item span{color:var(--muted);font-size:.88rem}
.st{width:12px;height:12px;border-radius:50%;background:var(--line);flex:none}
.st.l{background:var(--warn)}.st.d{background:var(--ok)}
/* Karte */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 18px;text-align:center;touch-action:pan-y;transition:transform .2s}
.cardtop{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.8rem;margin-bottom:10px}
.cardtop button{background:none;border:0;color:var(--muted);font-size:1.1rem;padding:4px}
.de-word{font-size:1.6rem;font-weight:800;display:inline-block;border-bottom:3px solid var(--blue);padding-bottom:4px;line-height:1.25}
.de-word.w{font-size:1.2rem;font-weight:700}
.typ{font-size:.85rem;color:var(--muted);margin-left:6px}
.lemma{margin-top:12px;font-size:1.15rem;font-weight:700;color:var(--blue);min-height:1.5em}
.lemma small{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
.old{display:inline-block;font-size:.75rem;color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.sv{font-size:1.22rem;line-height:1.7;margin:20px 0 8px}
.gap{font:inherit;font-weight:700;padding:2px 8px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center;max-width:100%}
.solo{width:100%;margin:18px 0 6px;font-size:1.15rem;padding:10px}
textarea.solo{min-height:84px;text-align:left;resize:vertical;font-weight:600}
.fill{font-weight:800;padding:0 4px;border-radius:6px}
.fill.ok{background:var(--ok-soft);color:var(--ok)}.fill.bad{background:var(--bad-soft);color:var(--bad)}
.dex{color:var(--muted);line-height:1.6}
.dex b{color:var(--ink)}
.answer{font-size:1.25rem;font-weight:700;margin:18px 0 6px;line-height:1.5}
.alts{color:var(--muted);font-size:.92rem;line-height:1.5}
.yours{font-size:.9rem;color:var(--muted);margin-top:8px}
.msg{min-height:1.3em;margin-top:10px;font-size:.9rem;font-weight:600}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}.msg.warn{color:var(--warn)}
.src{color:var(--muted);font-size:.8rem;margin-top:6px}
.tools{display:flex;justify-content:center;gap:10px;margin-top:14px}
.tool{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 14px;font-size:.9rem;font-weight:600}
.actions{margin-top:14px}
.rate{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.rate button{border-radius:18px;padding:14px 6px;font-weight:700;border:1px solid var(--line);background:var(--surface)}
.rate .no{color:var(--bad)}.rate .yes{background:var(--ok);border-color:var(--ok);color:#fff}.rate .never{color:var(--muted);font-size:.9rem}
.hintrow{display:flex;justify-content:flex-end;margin-top:8px}
.hintrow button{background:none;border:0;color:var(--blue);font-weight:600;padding:6px}
.done{text-align:center;padding:40px 10px}
.done b{display:block;font-size:1.4rem;margin-bottom:8px}
/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:540px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin:12px 0 4px}
.sheet input,.sheet textarea,.sheet select{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.sheet textarea{min-height:64px;resize:vertical}
.sheet .btns{display:flex;gap:10px;margin-top:18px}
.sheet .btns button{flex:1}
.danger{border:1px solid var(--bad);color:var(--bad);background:none;border-radius:14px;padding:12px;font-weight:600}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.2);text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:18px;padding:18px;text-align:center;color:var(--muted);line-height:1.5}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="wrap">

<section id="vHome">
  <div class="row" style="justify-content:space-between">
    <h1>Affärssvenska</h1>
    <div class="row">
      <button class="icon-btn" id="themeBtn" aria-label="Daylight/Moonlight umschalten">🌙</button>
      <button class="icon-btn" id="setBtn" aria-label="Einstellungen">⚙︎</button>
    </div>
  </div>
  <div class="streak">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="big" id="sCur">0</div><div class="lbl" id="sCurLbl">Tage in Folge</div></div>
      <div style="text-align:right"><div class="lbl">Rekord</div><div style="font-weight:800;font-size:1.2rem" id="sBest">0</div></div>
    </div>
    <div class="goalbar"><i id="gBar"></i></div>
    <div class="lbl" style="margin-top:6px" id="gTxt"></div>
    <div class="week" id="week"></div>
  </div>
  <button class="primary" id="learnAll">Alle fälligen Karten lernen</button>
  <button class="secondary" id="newWord" style="width:100%;margin-top:10px;padding:14px">＋ Neues Wort mit KI-Satz</button>
  <div id="noData" class="empty hidden" style="margin-top:16px">Noch keine Buchkarten geladen.<br>Tippe auf ⚙︎ und dann auf „Karten laden“.</div>
  <div class="section-title"><h2>Sammlungen</h2><button class="secondary" id="newColl">+ Sammlung</button></div>
  <div class="grid" id="grid"></div>
</section>

<section id="vColl" class="hidden">
  <div class="row"><button class="icon-btn" id="collBack" aria-label="Zurück">‹</button><h2 id="collName" style="flex:1"></h2><button class="icon-btn" id="collRename" aria-label="Sammlung umbenennen">✎</button></div>
  <div class="row" style="margin-top:14px"><button class="primary" id="collLearn" style="flex:2">Lernen</button><button class="secondary" id="collAdd" style="flex:1;padding:15px 10px">+ Karte</button></div>
  <div class="list" id="collList"></div>
  <button class="small secondary hidden" id="collReset" style="margin-top:14px;width:100%">Fortschritt dieser Sammlung zurücksetzen</button>
</section>

<section id="vLearn" class="hidden">
  <div class="row" style="margin-bottom:12px"><button class="icon-btn" id="learnBack" aria-label="Zurück">‹</button>
    <div style="flex:1;height:32px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem" id="left"></div></div>
  <div class="card" id="card"></div>
  <div class="hintrow" id="hintRow"><button id="hint">Hinweis</button></div>
  <div class="actions" id="actFront"><button class="primary" id="check">Aufdecken</button></div>
  <div class="actions rate hidden" id="actBack">
    <button class="no" id="rNo">✗ Nochmal</button><button class="never" id="rNever">Nie wieder</button><button class="yes" id="rYes">✓ Gewusst</button>
  </div>
  <div class="done hidden" id="done"><b>Geschafft!</b><span id="doneTxt">Für diese Auswahl sind heute keine Karten mehr fällig.</span><br><button class="secondary" id="donePractice" style="margin-top:16px">Freies Üben</button></div>
</section>

</div>
<div id="sheetRoot"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">

<script>
const EMBEDDED = /*__DATA__*/null;
const CHAPTERS = {1:"Kap. 1 – Personalen. Kontoret.",2:"Kap. 2 – Att vara anställd. Besök på banken.",3:"Kap. 3 – Att samtala i telefon",4:"Kap. 4 – Samtal på arbetet",5:"Kap. 5 – Besök på en mässa",6:"Kap. 6 – Besök hos en tillverkare",7:"Kap. 7 – Presentation av ett företags verksamhet",8:"Kap. 8 – Eira sammanfattar sina intryck"};
const STEPS=[1,2,4,7,10,14], DAY=86400000;

// ---------- Speicher ----------
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let base = EMBEDDED || LS.get("as-data",[]);
let user = Object.assign({cards:[],colls:[],edits:{},deleted:[],names:{}}, LS.get("as-user",{}));
let prog = LS.get("as-prog",{});
let streak = Object.assign({goal:30,days:{},best:0}, LS.get("as-streak",{}));
const saveUser=()=>LS.set("as-user",user), saveProg=()=>LS.set("as-prog",prog), saveStreak=()=>LS.set("as-streak",streak);

function allCards(){
  const del=new Set(user.deleted);
  const b=base.filter(c=>!del.has(c.id)).map(c=>user.edits[c.id]?Object.assign({},c,user.edits[c.id]):c);
  return b.concat(user.cards);
}
function collections(){
  const cs=allCards(), out=[];
  const ks=[...new Set(cs.filter(c=>c.k!=null).map(c=>c.k))].sort((a,b)=>a-b);
  ks.forEach(k=>out.push({id:"k"+k,name:user.names["k"+k]||CHAPTERS[k]||("Kap. "+k),match:c=>c.k===k}));
  user.colls.forEach(col=>out.push({id:col.id,name:col.name,own:true,match:c=>c.coll===col.id}));
  return out;
}
// ---------- Zeit & Streak ----------
const dkey=d=>{const x=new Date(d);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime()};
function curStreak(){
  let n=0,d=new Date();d.setHours(12,0,0,0);
  if(!(streak.days[dkey(d)]||{}).met) d.setDate(d.getDate()-1);
  while((streak.days[dkey(d)]||{}).met){n++;d.setDate(d.getDate()-1)}
  return n;
}
function countToday(){
  const k=dkey(Date.now()), t=streak.days[k]||{n:0,met:false};
  t.n++; let hit=false;
  if(!t.met && (t.n>=streak.goal || allCards().filter(isDue).length===0)){t.met=true;hit=true}
  streak.days[k]=t; streak.best=Math.max(streak.best,curStreak()); saveStreak();
  if(hit){fanfare();toast("Tagesziel erreicht! 🎉<br><span style='font-weight:500'>"+curStreak()+" Tag(e) in Folge</span>")}
}
// ---------- Status einer Karte ----------
const st=c=>prog[c.id];
const isDue=c=>{const s=st(c);return !s||(!s.done&&s.due<=today0())};
function statsOf(cs){let n=0,l=0,d=0;cs.forEach(c=>{const s=st(c);if(!s)n++;else if(s.done)d++;else l++});return {n,l,d}}

// ---------- Hilfen ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const bold=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const norm=s=>String(s).toLowerCase().replace(/[.,!?;:„“"”'’–-]/g," ").replace(/\s+/g," ").trim();
const plain=s=>norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const core=c=>c.sv.replace(/^\((en|ett)\)\s*/,"").replace(/^(en|ett)\s+/,"").replace(/\s*\(.*?\)\s*/g," ").split("/")[0].trim();
function answerOf(c){
  if(c.t==="w") return [c.sv].concat(c.alt||[]);
  const m=c.s&&c.s.match(/\{(.+?)\}/); if(m) return [m[1]];
  const k=core(c); return [k, c.sv.replace(/\s*\(.*?\)\s*/g," ").trim()];
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array(n+1).fill(0).map((_,i)=>i);for(let i=1;i<=m;i++){let c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function grade(c,typed){
  if(!typed.trim()) return "none";
  const ans=answerOf(c);
  if(ans.some(a=>norm(a)===norm(typed))) return "ok";
  if(ans.some(a=>plain(a)===plain(typed))) return "warn";
  if(c.t==="w" && ans.some(a=>{const x=plain(a),y=plain(typed);return lev(x,y)<=Math.max(2,Math.round(x.length*.12))})) return "close";
  return "bad";
}
function toast(html){const t=document.createElement("div");t.className="toast";t.innerHTML=html;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
let actx=null;
function fanfare(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume();
  [[523.25,0],[659.25,.13],[783.99,.26],[1046.5,.42]].forEach(([f,t])=>{const o=actx.createOscillator(),g=actx.createGain();o.type="triangle";o.frequency.value=f;
  const s=actx.currentTime+t;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+(t>.4?.7:.25));o.connect(g).connect(actx.destination);o.start(s);o.stop(s+.8)})}catch(e){}}
let voice=null;
function pickVoice(){const vs=speechSynthesis.getVoices().filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith("sv"));const os=vs.filter(v=>/oskar/i.test(v.name));voice=os.find(v=>/förbättrad|enhanced|premium/i.test(v.name))||os[0]||vs[0]||null}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text){if(!("speechSynthesis" in window))return;if(!voice||!/oskar/i.test(voice.name))pickVoice();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="sv-SE";if(voice)u.voice=voice;speechSynthesis.speak(u)}

// ---------- Satz generieren (Anthropic API) ----------
const MODELS=["claude-haiku-5-5","claude-sonnet-5-5"];
async function genSentence(key,word,de,topic){
  const prompt=`Du erstellst eine Lernkarte für einen deutschsprachigen Erwachsenen, der Business-Schwedisch auf Niveau B1–B2 lernt.
Lernwort: "${word}"${de?` (deutsche Bedeutung: ${de})`:""}. Ist das Wort deutsch, nimm die gängigste schwedische Entsprechung.
Bestimme Grundform (bei Substantiven mit en/ett davor), Wortart, Pluralendung bzw. Konjugationsgruppe (1–4 wie in schwedischen Lehrbüchern) und eine kurze deutsche Bedeutung.
Schreibe EINEN natürlichen, idiomatischen schwedischen Beispielsatz aus dem Arbeitsleben${topic?` (Thema der Sammlung: ${topic})`:""}, 8–16 Wörter, wie ihn ein Muttersprachler im Büro sagen würde. Markiere das Lernwort in genau der Form, in der es im Satz steht, genau einmal mit geschweiften Klammern.
Übersetze den Satz in natürliches Deutsch und setze die Entsprechung des Lernworts samt Artikel in **doppelte Sternchen**.
Antworte NUR mit JSON, ohne Erklärung und ohne Codeblock:
{"sv":"ett företag","de":"Unternehmen","typ":"Subst.","info":"-","s":"Hon har arbetat på samma {företag} i tio år.","d":"Sie arbeitet seit zehn Jahren in **demselben Unternehmen**."}
"typ" ist eines von: Subst., Verb, Partikelverb, Adj., Adv., Ausdruck, Verbausdruck.`;
  let last="";
  for(const model of MODELS){
    let r;
    try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:600,temperature:1,messages:[{role:"user",content:prompt}]})})}
    catch(e){throw new Error("Keine Verbindung. Bist du online?")}
    if(r.status===401)throw new Error("Der API-Schlüssel stimmt nicht. Bitte unter ⚙︎ prüfen.");
    if(r.status===402||r.status===403)throw new Error("Kein Guthaben oder kein Zugriff. Bitte in der Console prüfen.");
    if(r.status===429)throw new Error("Zu viele Anfragen. Bitte kurz warten.");
    if(r.status===404||r.status===400){last=await r.text();if(/model/i.test(last))continue;throw new Error("Anfrage abgelehnt.")}
    if(!r.ok)throw new Error("Fehler beim Erzeugen ("+r.status+"). Bitte noch einmal versuchen.");
    const j=await r.json();const txt=(j.content||[]).map(x=>x.text||"").join("").replace(/```json|```/g,"").trim();
    const o=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
    if(!o.s||!/\{.+?\}/.test(o.s))throw new Error("Der Satz war unbrauchbar. Bitte noch einmal versuchen.");
    return o;
  }
  throw new Error("Kein passendes Modell gefunden.");
}

function makeGap(sentence,form,c){
  if(!sentence.trim())return "";
  if(/\{.+?\}/.test(sentence))return sentence;
  const tryWrap=w=>{if(!w)return null;const i=sentence.toLowerCase().indexOf(w.toLowerCase());return i<0?null:sentence.slice(0,i)+"{"+sentence.slice(i,i+w.length)+"}"+sentence.slice(i+w.length)};
  let r=tryWrap(form.trim());if(r)return r;if(form.trim())return null;
  const k=core(c),rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(!k.includes(" ")){for(const stem of [k,k.slice(0,Math.max(3,k.length-1))]){const m=sentence.match(new RegExp("(^|[^\\p{L}])("+rx(stem)+"\\p{L}*)","iu"));if(m)return tryWrap(m[2])}}
  r=tryWrap(k);if(r)return r;
  return null;
}

  $("sWerk").onclick=()=>{fileMode="werkstatt";$("fileIn").click()};
  $("sExport").onclick=()=>{const blob=new Blob([JSON.stringify({backup:1,user,prog,streak})],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="affarssvenska-sicherung-"+dkey(Date.now())+".json";document.body.appendChild(a);a.click();a.remove()};
}
let fileMode="data";
$("fileIn").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);
    if(j.werkstatt){if(!Array.isArray(j.cards))throw 0;const name=(j.collection||"Kartenwerkstatt").trim();
      let col=user.colls.find(x=>x.name===name);if(!col){col={id:"c"+Date.now().toString(36),name};user.colls.push(col)}
      j.cards.forEach((c,i)=>{if(!c.de||!c.sv)return;user.cards.push({id:"u"+Date.now().toString(36)+i,t:"v",de:c.de,sv:c.sv,info:c.info||"",typ:c.typ||"Subst.",s:c.s||"",d:c.d||"",alt:[],note:"",ki:!!c.ki,coll:col.id})});
      saveUser();toast(j.cards.length+" Karten in „"+esc(name)+"“ importiert")}
    else if(fileMode==="backup"){if(!j.backup)throw 0;user=Object.assign(user,j.user);prog=j.prog||{};streak=Object.assign(streak,j.streak);saveUser();saveProg();saveStreak();toast("Sicherung wiederhergestellt")}
    else{const arr=Array.isArray(j)?j:j.cards;if(!Array.isArray(arr))throw 0;base=arr;LS.set("as-data",arr);toast(arr.length+" Karten geladen")}
    closeSheet();renderHome()}catch(x){alert("Die Datei konnte nicht gelesen werden.")}};
  r.readAsText(f);e.target.value=""};

// ---------- Verdrahtung ----------
function setTheme(t){document.documentElement.dataset.theme=t;$("themeBtn").textContent=t==="dark"?"☀️":"🌙";LS.set("as-theme",t)}
setTheme(LS.get("as-theme","light"));
$("themeBtn").onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
$("setBtn").onclick=settings;
$("newWord").onclick=()=>{const last=LS.get("as-lastcoll","");const ok=collections().some(x=>x.id===last);
  const mw=user.colls.find(x=>x.name==="Meine Wörter");
  editCard({t:"v",de:"",sv:"",info:"",typ:"Subst.",s:"",d:"",pick:ok?last:(mw?mw.id:"__new__")})};$("newColl").onclick=newColl;
$("learnAll").onclick=()=>{allCards().some(isDue)?startLearn(()=>true,"vHome"):startPractice(()=>true,"vHome")};
let lastFilter=()=>true;
$("donePractice").onclick=()=>startPractice(lastFilter,from);
$("collBack").onclick=()=>{show("vHome");renderHome()};
$("collRename").onclick=renameColl;
$("collLearn").onclick=()=>{const col=getColl(curColl);const f=col.match;allCards().filter(f).some(isDue)?startLearn(f,"vColl"):(lastFilter=f,startPractice(f,"vColl"))};
$("collAdd").onclick=()=>{const col=getColl(curColl);editCard({t:"v",de:"",sv:"",info:"",typ:"Subst.",s:"",d:"",coll:col.own?col.id:undefined,k:col.own?undefined:+col.id.slice(1)})};
$("collReset").onclick=()=>{if(!confirm("Fortschritt nur für diese Sammlung zurücksetzen?"))return;allCards().filter(getColl(curColl).match).forEach(c=>delete prog[c.id]);saveProg();renderColl()};
$("learnBack").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}show(from);from==="vColl"?renderColl():renderHome()};
$("check").onclick=reveal;$("hint").onclick=hint;
$("rYes").onclick=()=>rate("yes");$("rNo").onclick=()=>rate("no");$("rNever").onclick=()=>rate("never");
document.addEventListener("click",()=>{if(actx&&actx.state==="suspended")actx.resume()},{once:true});
renderHome();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
